    transition: all .2s;

  .day-card:hover { background: #242a3a; border-color: #3a4256; }
  .day-card.active { background: #2b3350; border-color: #6b7ee3; }
  .day-head { display: flex; align-items: center; gap: 10px; }

  }

  .map-wrap { position: relative; }
  #map { width: 100%; height: 100%; background: #eef2f7; }

  .panel {
    position: absolute; top: 16px; right: 16px;
    width: 380px; max-height: calc(100vh - 32px);
    background: #161a22;
    border: 1px solid #262b36;
    border-radius: 12px;

    display: none;

  .panel.show { display: block; }
  .panel-head {

  .panel-sub { font-size: 12px; color: #8a93a4; margin: 2px 0 0 0; }

  .panel-body { padding: 16px 18px; }
  .section-h { font-size: 13px; font-weight: 600; color: #fff; margin: 14px 0 8px 0; }
  .section-h:first-child { margin-top: 0; }
  .timeline { list-style: none; padding: 0; margin: 0; }
  .timeline li {

    font-size: 13px; color: #c0c7d5; line-height: 1.6;

  .timeline li::before {

  .booking-btns a {

  .alt-item {

const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([44.0, 82.0], 8);

  subdomains: '1234', maxZoom: 18
});
const gaodeSat = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
  subdomains: '1234', maxZoom: 18
});
const gaodeSatLabel = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
  subdomains: '1234', maxZoom: 18
});
const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  subdomains: 'abc', maxZoom: 18
});

gaodeVector.addTo(map);

const baseLayers = {
  '高德矢量（默认）': gaodeVector,
  '高德卫星': L.layerGroup([gaodeSat, gaodeSatLabel]),
  'OpenStreetMap': osm
};
L.control.layers(baseLayers, null, { position: 'topleft', collapsed: true }).addTo(map);

L.control.attribution({ prefix: false }).addAttribution('© 高德地图 / OSM').addTo(map);

const dayLayers = {};

DAYS.forEach(d => routeColors[d.id] = d.color);

function haversine(a, b) {
  if (!a || !b) return 0;
  const R = 6371;
  const toRad = x => x * Math.PI / 180;
  const dLat = toRad(b[0] - a[0]);
  const dLon = toRad(b[1] - a[1]);
  const lat1 = toRad(a[0]), lat2 = toRad(b[0]);
  const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

DAYS.forEach(day => {
  const layer = L.layerGroup();
  const coords = day.points.map(p => p.coord);

  if (coords.length >= 2) {
    L.polyline(coords, {
      color: day.color, weight: 4, opacity: 0.85,
      lineCap: 'round', lineJoin: 'round'
    }).addTo(layer);
  }

  day.points.forEach((p, idx) => {
    const isHotel = p.type === 'hotel';
    let icon;
    if (isHotel) {
      icon = L.divIcon({
        className: 'custom-marker',
        html: `<div class="marker-hotel" style="background:${day.color}">
          <div class="bed">🛏</div>
          <div class="n">D${day.id}住</div>
        </div>`,
        iconSize: [44, 44], iconAnchor: [22, 52]
      });
    } else {
      icon = L.divIcon({
        className: 'custom-marker',
        html: `<div class="marker-pin" style="background:${day.color}">
          <span><div class="day-num">D${day.id}</div><div class="idx-num">${idx+1}</div></span>
        </div>`,
        iconSize: [34, 34], iconAnchor: [17, 34]
      });
    }
    const popupTitle = isHotel ? `Day ${day.id} · 🛏 住：${p.name}` : `Day ${day.id} · 第${idx+1}站 · ${p.name}`;
    L.marker(p.coord, { icon, zIndexOffset: isHotel ? 1000 : 0 })
      .addTo(layer)
      .bindPopup(`<b style="color:${day.color}">${popupTitle}</b><br>${p.desc}`)
      .bindTooltip(p.name, { permanent: false, direction: 'top', offset: [0, -30] })
      .on('click', () => showDay(day.id));
  });

  layer.addTo(map);
  dayLayers[day.id] = layer;
});

const dayList = document.getElementById('dayList');
DAYS.forEach(day => {
  const card = document.createElement('div');
  card.className = 'day-card';
  card.dataset.dayId = day.id;
  card.innerHTML = `
    <div class="day-head">
      <div class="day-badge" style="background:${day.color}">D${day.id}</div>
      <div>
        <div class="day-title">${day.title}</div>
        <div class="day-date">${day.date} · ${day.drive}</div>
      </div>
    </div>
    <div class="day-meta">${day.weather}</div>
    <div class="day-meta" style="color:#7cd4a8;margin-top:4px;">🛏 ${day.lodging.name}</div>
    <div>
      ${day.points.slice(0, 4).map(p => `<span class="chip">${p.name}</span>`).join('')}
    </div>
  `;
  card.addEventListener('click', () => showDay(day.id));
  dayList.appendChild(card);
});

function showDay(id) {
  const day = DAYS.find(d => d.id === id);
  if (!day) return;

  document.querySelectorAll('.day-card').forEach(c => {
    c.classList.toggle('active', +c.dataset.dayId === id);
  });

  map.flyTo(day.center, day.zoom, { duration: 0.8 });

  document.getElementById('panelTitle').innerText = `Day ${day.id} · ${day.title}`;
  document.getElementById('panelTitle').style.color = day.color;
  document.getElementById('panelSub').innerText = `${day.date} · ${day.drive}`;

  const body = document.getElementById('panelBody');
  const start = day.points[0];
  const end = day.points[day.points.length - 1];
  const startToLodgeKm = day.lodging.coord ? haversine(start.coord, day.lodging.coord).toFixed(0) : null;
  const endToLodgeKm = day.lodging.coord ? haversine(end.coord, day.lodging.coord).toFixed(0) : null;

  const lodgingHtml = day.lodging.coord ? `
    <div class="lodging-box">
      <div class="lodging-head">
        <div class="icon">🛏</div>
        <div style="flex:1;">
          <div class="name">${day.lodging.name}</div>
          <div class="meta">${day.lodging.area}</div>
          <div class="meta"><span class="price">${day.lodging.price || ''}</span> · ${day.lodging.note}</div>
          <div class="distance">起点 → 酒店 直线约 ${startToLodgeKm} km · 终点 → 酒店 约 ${endToLodgeKm} km</div>
          ${day.lodging.warning ? `<div class="warn">${day.lodging.warning}</div>` : ''}
        </div>
      </div>
      <div class="booking-btns">
        ${(day.lodging.booking || []).map(b => `<a href="${b.url}" target="_blank" rel="noopener">${b.platform}订房 →</a>`).join('')}
      </div>
      ${day.lodging.alternatives && day.lodging.alternatives.length ? `
        <div class="alt-title">备选酒店</div>
        ${day.lodging.alternatives.map(a => `
          <div class="alt-item">
            <span class="an">${a.name}</span><span class="ap">${a.price}</span>
            <div class="anote">${a.note}</div>
          </div>
        `).join('')}
      ` : ''}
    </div>
  ` : `
    <div class="lodging-box">
      <div class="lodging-head">
        <div class="icon">✈</div>
        <div>
          <div class="name">${day.lodging.name}</div>
          <div class="meta">${day.lodging.area} · ${day.lodging.note}</div>
        </div>
      </div>
    </div>
  `;

  body.innerHTML = `
    <div class="stat-row">
      <div class="stat">🌤️ <strong>天气</strong>：${day.weather}</div>
    </div>
    <div class="stat-row">
      <div class="stat">🚗 <strong>今日车程</strong>：${day.drive}</div>
    </div>

    ${lodgingHtml}

    <div class="section-h">📍 今日节点</div>
    <div>${day.points.map(p => `<span class="chip">${p.type==='hotel'?'🛏 ':''}${p.name}</span>`).join('')}</div>

    <div class="section-h">🗓️ 时间安排</div>
    <ul class="timeline">
      ${day.schedule.map(s => `<li><span class="time">${s.time}</span> · ${s.act}</li>`).join('')}
    </ul>

    <div class="section-h">🌦️ 天气 & 景点评估</div>
    <div style="font-size:12px;color:#c0c7d5;line-height:1.7;">${day.weatherEval}</div>

    <div class="section-h">💡 关键提示</div>
    <div class="tips">${day.tips}</div>
  `;

  document.getElementById('panel').classList.add('show');
}

function closePanel() {
  document.getElementById('panel').classList.remove('show');
  document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
}

showDay(1);
</script>
