<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>伊犁 5 日自驾攻略 · 9.25–9.29 · F6</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    height: 100vh;
    overflow: hidden;
  }
  .app { display: grid; grid-template-columns: 340px 1fr; height: 100vh; }
  .sidebar { background: #161a22; border-right: 1px solid #262b36; overflow-y: auto; padding: 18px; }
  .header h1 { font-size: 17px; margin: 0 0 4px 0; font-weight: 600; color: #fff; }
  .header p { font-size: 12px; color: #8a93a4; margin: 0 0 6px 0; }
  .data-note { font-size: 11px; color: #7cd4a8; margin: 0 0 16px 0; padding: 6px 10px; background: rgba(124,212,168,.08); border-radius: 6px; }
  .day-card { padding: 12px; margin-bottom: 8px; border-radius: 10px; background: #1e2330; border: 1px solid #262b36; cursor: pointer; transition: all .2s; }
  .day-card:hover { background: #242a3a; border-color: #3a4256; }
  .day-card.active { background: #2b3350; border-color: #6b7ee3; }
  .day-head { display: flex; align-items: center; gap: 10px; }
  .day-badge { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  .day-title { font-size: 13px; font-weight: 600; color: #fff; }
  .day-date { font-size: 11px; color: #8a93a4; }
  .day-meta { margin-top: 6px; font-size: 11px; color: #a8b0c0; line-height: 1.6; }
  .chip { display: inline-block; padding: 2px 6px; margin: 3px 3px 0 0; background: #262b36; border-radius: 4px; font-size: 10px; color: #b8c0d0; }

  #map { width: 100%; height: 100%; background: #eef2f7; }
  .map-wrap { position: relative; }

  .panel {
    position: absolute; top: 14px; right: 14px;
    width: 380px; max-height: calc(100vh - 28px);
    background: #161a22; border: 1px solid #262b36; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    overflow-y: auto; z-index: 500; display: none;
  }
  .panel.show { display: block; }
  .panel-head {
    padding: 14px 16px; border-bottom: 1px solid #262b36;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; background: #161a22; z-index: 1;
  }
  .panel-title { font-size: 15px; font-weight: 600; margin: 0; }
  .panel-sub { font-size: 11px; color: #8a93a4; margin: 2px 0 0 0; }
  .close-btn { background: transparent; border: 0; color: #8a93a4; font-size: 20px; cursor: pointer; padding: 4px 8px; }
  .close-btn:hover { color: #fff; }
  .panel-body { padding: 14px 16px; }
  .section-h { font-size: 12px; font-weight: 600; color: #fff; margin: 14px 0 8px 0; letter-spacing: .3px; }
  .section-h:first-child { margin-top: 0; }

  .segments { list-style: none; padding: 0; margin: 0; }
  .segments li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 8px; margin-bottom: 4px;
    background: rgba(255,255,255,.03); border-radius: 5px;
    font-size: 11px; color: #c0c7d5;
  }
  .segments .route-name { flex: 1; }
  .segments .route-data { color: #7cd4a8; font-weight: 500; font-size: 11px; }

  .lodging-box {
    padding: 12px; margin: 10px 0;
    background: rgba(107,126,227,.08);
    border-left: 3px solid #6b7ee3; border-radius: 6px;
  }
  .lodging-head { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 8px; }
  .lodging-icon {
    width: 32px; height: 32px; border-radius: 8px;
    background: #6b7ee3; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
  }
  .lodging-name { font-size: 13px; font-weight: 600; color: #fff; }
  .lodging-meta { font-size: 11px; color: #a8b0c0; margin-top: 2px; line-height: 1.5; }
  .price-note { color: #ffcd7a; font-size: 11px; margin-top: 6px; }
  .booking-btns { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .booking-btns a {
    padding: 5px 10px; font-size: 11px;
    background: #2b3350; color: #a8c3ff; border-radius: 4px;
    text-decoration: none; border: 1px solid #3a4670;
  }
  .booking-btns a:hover { background: #3a4670; color: #fff; }

  .alt-item {
    padding: 8px 10px; margin-bottom: 4px;
    background: rgba(255,255,255,.03); border-radius: 5px; font-size: 11px;
  }
  .alt-item .an { color: #e6e6e6; font-weight: 500; }
  .alt-item .anote { color: #8a93a4; font-size: 11px; margin-top: 2px; }

  .highlights { list-style: none; padding: 0; margin: 0; }
  .highlights li {
    padding: 5px 0 5px 16px; position: relative;
    font-size: 12px; color: #c0c7d5; line-height: 1.6;
  }
  .highlights li::before {
    content: '•'; position: absolute; left: 0; top: 5px;
    color: #6b7ee3; font-weight: 700;
  }
  .warn { color: #ff9f6b; font-size: 11px; margin-top: 8px; padding: 6px 8px; background: rgba(255,159,107,.08); border-radius: 5px; }

  .marker-pin {
    width: 34px; height: 34px; border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg); display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 13px;
    box-shadow: 0 2px 8px rgba(0,0,0,.35);
    border: 2px solid #fff;
  }
  .marker-pin span { transform: rotate(45deg); line-height: 1; text-align: center; }

  .marker-hotel {
    width: 42px; height: 42px; border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #fff; font-weight: 700;
    box-shadow: 0 4px 12px rgba(0,0,0,.4); border: 3px solid #fff;
  }
  .marker-hotel .bed { font-size: 16px; line-height: 1; }
  .marker-hotel .n { font-size: 10px; margin-top: 2px; }

  .legend {
    position: absolute; bottom: 14px; left: 14px;
    background: rgba(22,26,34,.92); padding: 10px 14px; border-radius: 8px;
    border: 1px solid #262b36; font-size: 12px; color: #c0c7d5; z-index: 500;
  }
  .legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; grid-template-rows: 40vh 60vh; }
    .sidebar { padding: 12px; }
    .header h1 { font-size: 15px; }
    .panel { width: calc(100% - 20px); top: 10px; right: 10px; left: 10px; max-height: calc(60vh - 20px); }
    .legend { display: none; }
  }
</style>
</head>

function initMap() {
  const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([43.8, 82.0], 8);

  const gaodeVec = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: '1234', maxZoom: 18
  });
  const gaodeSat = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
    subdomains: '1234', maxZoom: 18
  });
  const gaodeSatLabel = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
    subdomains: '1234', maxZoom: 18
  });
  const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    subdomains: 'abc', maxZoom: 18
  });

  gaodeVec.addTo(map);

  L.control.layers({
    '高德矢量': gaodeVec,
    '高德卫星': L.layerGroup([gaodeSat, gaodeSatLabel]),
    'OpenStreetMap': osm
  }, null, { position: 'topleft', collapsed: true }).addTo(map);
  L.control.attribution({ prefix: false }).addAttribution('© 高德/OSM · 路径 OSRM').addTo(map);

  // Draw routes using real OSRM geometry
  const dayColors = { D1: "#7F77DD", D2: "#378ADD", D3: "#1D9E75", D4: "#BA7517", D5: "#D4537E" };
  const drawnPoints = new Set();

  ROUTES.segments.forEach(seg => {
    const latLngs = seg.geometry.map(c => [c[1], c[0]]);
    L.polyline(latLngs, {
      color: dayColors[seg.day], weight: 4, opacity: 0.85,
      lineCap: 'round', lineJoin: 'round'
    }).addTo(map);
  });

  // Draw markers for each unique point
  const pointToDay = {};
  ROUTES.segments.forEach(seg => {
    if (!pointToDay[seg.from]) pointToDay[seg.from] = seg.day;
    if (!pointToDay[seg.to]) pointToDay[seg.to] = seg.day;
  });

  Object.entries(ROUTES.points).forEach(([name, coord]) => {
    if (!pointToDay[name]) return;
    const day = pointToDay[name];
    const dayId = parseInt(day.substr(1));
    const isHotel = name.includes('酒店') || name.includes('民宿');
    const color = dayColors[day];

    let icon;
    if (isHotel) {
      icon = L.divIcon({
        className: 'custom-marker',
        html: `<div class="marker-hotel" style="background:${color}"><div class="bed">🛏</div><div class="n">${day}住</div></div>`,
        iconSize: [42, 42], iconAnchor: [21, 50]
      });
    } else {
      icon = L.divIcon({
        className: 'custom-marker',
        html: `<div class="marker-pin" style="background:${color}"><span>${day}</span></div>`,
        iconSize: [34, 34], iconAnchor: [17, 34]
      });
    }

    L.marker(coord, { icon, zIndexOffset: isHotel ? 1000 : 0 })
      .addTo(map)
      .bindPopup(`<b style="color:${color}">${day} · ${name}</b>`)
      .bindTooltip(name, { permanent: false, direction: 'top' })
      .on('click', () => showDay(dayId));
  });

  window._map = map;
}

function showDay(id) {
  const day = DAYS.find(d => d.id === id);
  if (!day) return;

  document.querySelectorAll('.day-card').forEach(c => {
    c.classList.toggle('active', +c.dataset.dayId === id);
  });

  if (window._map) window._map.flyTo(day.center, day.zoom, { duration: 0.8 });

  // Compute segments for this day
  const daySegs = ROUTES.segments.filter(s => s.day === `D${id}`);
  const totalKm = daySegs.reduce((a, s) => a + s.km, 0);
  const totalMin = daySegs.reduce((a, s) => a + s.min, 0);

  document.getElementById('panelTitle').innerText = `Day ${id} · ${day.title}`;
  document.getElementById('panelTitle').style.color = day.color;
  document.getElementById('panelSub').innerText = `${day.date} · 累计约 ${totalKm.toFixed(0)}km / ${(totalMin/60).toFixed(1)}h（OSRM 实测）`;

  const lodgingHtml = day.lodging ? `
    <div class="lodging-box">
      <div class="lodging-head">
        <div class="lodging-icon">🛏</div>
        <div style="flex:1;">
          <div class="lodging-name">${day.lodging.name}</div>
          <div class="lodging-meta">${day.lodging.area}</div>
          <div class="lodging-meta">${day.lodging.pros}</div>
          <div class="price-note">💡 价格请点击下方按钮查询携程/美团实时价</div>
        </div>
      </div>
      <div class="booking-btns">
        <a href="${day.lodging.booking.ctrip}" target="_blank" rel="noopener">去携程查价 →</a>
        <a href="${day.lodging.booking.meituan}" target="_blank" rel="noopener">去美团查价 →</a>
        <a href="${day.lodging.booking.fliggy}" target="_blank" rel="noopener">去飞猪查价 →</a>
      </div>
      ${day.lodging.alt.length ? `
        <div class="section-h" style="margin-top:12px;">备选酒店</div>
        ${day.lodging.alt.map(a => `
          <div class="alt-item">
            <span class="an">${a.n}</span>
            <div class="anote">${a.d}</div>
          </div>
        `).join('')}
      ` : ''}
    </div>
  ` : '<div style="padding:10px; background:rgba(255,255,255,.03); border-radius:6px; font-size:12px; color:#8a93a4;">✈ 当天离开伊宁，无住宿</div>';

  const body = document.getElementById('panelBody');
  body.innerHTML = `
    <div class="section-h">🚗 今日路段（OSRM 接口实测）</div>
    <ul class="segments">
      ${daySegs.map(s => `<li><span class="route-name">${s.from} → ${s.to}</span><span class="route-data">${s.km}km / ${s.min}min</span></li>`).join('')}
    </ul>

    <div class="section-h">🛏 今晚住哪</div>
    ${lodgingHtml}

    <div class="section-h">🎯 今日亮点</div>
    <ul class="highlights">
      ${day.highlights.map(h => `<li>${h}</li>`).join('')}
    </ul>

    ${day.warn ? `<div class="warn">${day.warn}</div>` : ''}
  `;

  document.getElementById('panel').classList.add('show');
}

function closePanel() {
  document.getElementById('panel').classList.remove('show');
  document.querySelectorAll('.day-card').forEach(c => c.classList.remove('active'));
}

// Build sidebar
const dayList = document.getElementById('dayList');
DAYS.forEach(day => {
  const daySegs = ROUTES.segments.filter(s => s.day === `D${day.id}`);
  const totalKm = daySegs.reduce((a, s) => a + s.km, 0);
  const totalMin = daySegs.reduce((a, s) => a + s.min, 0);

  const card = document.createElement('div');
  card.className = 'day-card';
  card.dataset.dayId = day.id;
  card.innerHTML = `
    <div class="day-head">
      <div class="day-badge" style="background:${day.color}">D${day.id}</div>
      <div>
        <div class="day-title">${day.title}</div>
        <div class="day-date">${day.date} · ${totalKm.toFixed(0)}km / ${(totalMin/60).toFixed(1)}h</div>
      </div>
    </div>
    ${day.lodging ? `<div class="day-meta">🛏 ${day.lodging.name}</div>` : '<div class="day-meta">✈ 送机日</div>'}
  `;
  card.addEventListener('click', () => showDay(day.id));
  dayList.appendChild(card);
});

window.closePanel = closePanel;
window.showDay = showDay;

window.addEventListener('DOMContentLoaded', function() {
  if (typeof L === 'undefined') {
    document.getElementById('map').innerHTML = '<div style="padding:40px;text-align:center;color:#888;">地图库加载失败，请刷新页面</div>';
    return;
  }
  initMap();
  const isMobile = window.innerWidth < 800;
  if (!isMobile) showDay(1);
});
</script>
</body>
</html>
